spring.application.name=merchant-qr-registration

server.port=8080

spring.datasource.url=YOUR_URL
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Do not allow Hibernate to create or modify tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# Disable Spring SQL initialization.
spring.sql.init.mode=never

# Existing account table.
app.account.table=account001

# Actual column from your ACCOUNT001 table.
app.account.number-column=ACCOUNTNO

spring.thymeleaf.cache=false